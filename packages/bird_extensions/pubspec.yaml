name: bird_extensions
description: >-
  WebExtensions support for FlutterBird: AMO install pipeline, manifest model,
  permissions and the extension registry. Pure Dart so it can be tested
  without the engine.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  crypto: ^3.0.6
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
