name: flutterbird
description: "A Web Browser built on the Ladybird engine"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  window_manager: ^0.5.1
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  ladybird:
    path: packages/libbird
  bird_core:
    path: packages/bird_core
  bird_extensions:
    path: packages/bird_extensions
  bird_session:
    path: packages/bird_session
  bird_window:
    path: packages/bird_window
  riverpod_annotation: ^4.0.2
  go_router: ^17.1.0
  google_fonts: ^8.1.0
  go_transitions: ^0.8.3
  reorderable_grid_view: ^2.2.8
  path_provider: ^2.1.5
  path: ^1.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.17.1

flutter:
  # macOS runs one window per browser window on Flutter's windowing API, which
  # is experimental: it needs the master channel and this flag.
  config:
    enable-windowing: true
  uses-material-design: true
